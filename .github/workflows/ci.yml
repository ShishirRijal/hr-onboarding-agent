# Runs on every pull request and push to main. No API keys: the tests use fake models,
# so nothing here calls OpenAI, Cohere or Langfuse.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    # The tests use SQLite files; the database copy is also tested against real Postgres.
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: hr
          POSTGRES_PASSWORD: hr-ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: poetry.lock
      # Dependencies from poetry.lock, with PyTorch's CPU build instead of the default one
      # and its several GB of CUDA libraries, as in the Docker image.
      - name: Install dependencies
        run: |
          pip install "poetry>=2,<3" poetry-plugin-export
          poetry export --without-hashes --extras dev -o requirements.txt
          grep -E '^torch==' requirements.txt | cut -d ';' -f 1 > torch.txt
          pip install -r torch.txt --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|triton|nvidia-|cuda-)' requirements.txt > requirements-cpu.txt
          pip install -r requirements-cpu.txt
      - name: Run tests
        run: PYTHONPATH=. pytest -q
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://hr:hr-ci@localhost:5432/postgres

  web:
    name: Web app checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Page props are typed from the routes, which Next.js generates.
      - name: Type check
        run: npx next typegen && npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
