[project]
name = "hr-onboarding-agent"
version = "0.1.0"
description = "LangGraph + RAG HR onboarding agent for NordTech Solutions"
authors = [
    {name = "ShishirRijal",email = "ccrrizal0892@gmail.com"}
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-community>=0.3",
    "langchain-qdrant>=0.2",
    "qdrant-client>=1.11",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.40",
    "pymupdf>=1.24",
    "cohere>=5.0",
    "ragas>=0.2",
    "apscheduler>=3.10",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "langsmith>=0.1",
    "rank-bm25>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
