# The whole stack: `docker compose up --build`, then open http://localhost:3000.
# The API reads secrets from .env (copy .env.example and add OPENAI_API_KEY).
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: hr-onboarding-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  # Chats, the HR inbox, model usage and accounts. Port 5433 on the host, so it doesn't
  # clash with another Postgres on 5432. The password is for local use only.
  postgres:
    image: postgres:17.6-alpine
    container_name: hr-onboarding-postgres
    environment:
      POSTGRES_USER: hr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hr-local}
      POSTGRES_DB: hr_onboarding
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr -d hr_onboarding"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Catches outgoing email locally so the HR digest can be checked without sending real
  # mail: SMTP on 1025, inbox at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.31.5
    container_name: hr-onboarding-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  # On a first start it ingests the corpus into Qdrant and adds the demo accounts.
  api:
    build: .
    container_name: hr-onboarding-api
    env_file: .env
    # The other services by their names inside the stack, whatever .env says for local runs.
    environment:
      QDRANT_URL: http://qdrant:6333
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      INTERACTIONS_DATABASE_URL: postgresql+psycopg://hr:${POSTGRES_PASSWORD:-hr-local}@postgres:5432/hr_onboarding
      CORPUS_DIR: corpus
      WEB_ORIGINS: http://localhost:3000
    # Evaluation reports, exports and backups, shared with runs outside Docker.
    volumes:
      - ./data:/app/data
    ports:
      - "8010:8010"
    depends_on:
      qdrant:
        condition: service_started
      mailpit:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  web:
    build: ./web
    container_name: hr-onboarding-web
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  qdrant_storage:
  postgres_data:
